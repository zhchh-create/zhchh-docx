<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>全栈技术知识库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236366f1'/%3E%3Cpath d='M20 22h24M20 32h24M20 42h14' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#fafafa;
  --bg-elev:#ffffff;
  --bg-hover:#f4f4f5;
  --border:#e7e7ea;
  --border-strong:#d4d4d8;
  --ink:#18181b;
  --ink-2:#3f3f46;
  --ink-3:#71717a;
  --ink-4:#a1a1aa;
  --accent:#6366f1;
  --accent-soft:#eef0ff;
  --accent-ink:#4f46e5;
  --deep:#dc2626;
  --std:#2563eb;
  --basic:#16a34a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 2px 8px rgba(0,0,0,.04);
  --shadow-lg:0 16px 40px -12px rgba(0,0,0,.15);
  --radius:10px;
  --topbar-h:60px;
}
[data-theme="dark"]{
  --bg:#09090b;
  --bg-elev:#131316;
  --bg-hover:#1f1f23;
  --border:#26262b;
  --border-strong:#3a3a41;
  --ink:#fafafa;
  --ink-2:#e4e4e7;
  --ink-3:#a1a1aa;
  --ink-4:#71717a;
  --accent:#818cf8;
  --accent-soft:#2a2a4a;
  --accent-ink:#a5b4fc;
  --deep:#f87171;
  --std:#60a5fa;
  --basic:#4ade80;
  --shadow-md:0 2px 8px rgba(0,0,0,.3);
  --shadow-lg:0 16px 40px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;
  -webkit-font-smoothing:antialiased;transition:background .25s,color .25s;
  padding-top:var(--topbar-h);
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--accent);color:#fff}

/* ===== 顶栏 ===== */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:100;
  background:color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--border);
}
.topbar-in{max-width:1180px;margin:0 auto;height:100%;padding:0 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;flex:none}
.brand .logo{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:grid;place-items:center;color:#fff;font-size:14px;
}
.brand span{white-space:nowrap}
.topbar .grow{flex:1}
.icon-btn{
  width:34px;height:34px;border-radius:8px;display:grid;place-items:center;
  color:var(--ink-3);transition:.15s;flex:none;
}
.icon-btn:hover{background:var(--bg-hover);color:var(--ink)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== 主区 ===== */
main{max-width:1180px;margin:0 auto;padding:40px 24px 80px}

/* 欢迎区 */
.hero{margin-bottom:36px}
.hero .eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;color:var(--accent-ink);background:var(--accent-soft);
  padding:4px 12px;border-radius:999px;font-weight:500;margin-bottom:16px;
}
.hero h1{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.25;margin-bottom:8px}
.hero p{color:var(--ink-3);font-size:14.5px;max-width:560px}

/* 搜索框 */
.search-wrap{position:relative;max-width:560px;margin:20px 0 28px}
.search-wrap input{
  width:100%;height:46px;padding:0 44px 0 44px;
  border-radius:12px;border:1px solid var(--border-strong);
  background:var(--bg-elev);font-size:14.5px;outline:none;
  box-shadow:var(--shadow-md);transition:.2s;color:var(--ink);
}
.search-wrap input::placeholder{color:var(--ink-4)}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-wrap .s-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink-4);fill:none;stroke-width:2}
.search-wrap .kbd-hint{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-size:11px;color:var(--ink-4);background:var(--bg-hover);
  padding:3px 8px;border-radius:6px;border:1px solid var(--border);
  font-family:ui-monospace,monospace;
}

/* 工具栏 */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.toolbar .lbl{font-size:12.5px;color:var(--ink-4);margin-right:4px}
.pill{
  font-size:12.5px;padding:5px 12px;border-radius:999px;
  background:transparent;color:var(--ink-3);border:1px solid var(--border);
  transition:.15s;cursor:pointer;
}
.pill:hover{border-color:var(--ink-4);color:var(--ink)}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
.pill.on[data-d="deep"]{background:var(--deep);color:#fff;border-color:var(--deep)}
.pill.on[data-d="std"]{background:var(--std);color:#fff;border-color:var(--std)}
.pill.on[data-d="basic"]{background:var(--basic);color:#fff;border-color:var(--basic)}

/* 分类网格 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
.cat{
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;
  transition:border-color .15s, box-shadow .15s;
  display:flex;flex-direction:column;
}
.cat:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md)}
.cat-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.cat-ic{
  width:36px;height:36px;border-radius:9px;flex:none;
  background:var(--accent-soft);display:grid;place-items:center;font-size:18px;
}
.cat-head h3{font-size:15px;font-weight:600;line-height:1.2}
.cat-head .n{font-size:11.5px;color:var(--ink-4);margin-top:1px}
.cat-desc{font-size:12.5px;color:var(--ink-3);margin:6px 0 12px;line-height:1.5;min-height:36px}
.cat-arts{display:flex;flex-direction:column;gap:1px;margin-top:auto}
.cat-art{
  display:flex;align-items:center;gap:7px;
  padding:6px 8px;border-radius:6px;font-size:13px;
  color:var(--ink-2);transition:.12s;
}
.cat-art:hover{background:var(--bg-hover);color:var(--ink)}
.cat-art .dot{flex:none;width:5px;height:5px;border-radius:50%}
.cat-art .dot.deep{background:var(--deep)}
.cat-art .dot.std{background:var(--std)}
.cat-art .dot.basic{background:var(--basic)}
.cat-art .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 搜索覆盖层 */
.overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.35);backdrop-filter:blur(6px);
  display:none;align-items:flex-start;justify-content:center;
  padding:12vh 20px 20px;
}
.overlay.show{display:flex}
.modal{
  width:100%;max-width:600px;background:var(--bg-elev);
  border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;
  border:1px solid var(--border);
}
.modal-search{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-search svg{width:18px;height:18px;stroke:var(--ink-4);fill:none;stroke-width:2;flex:none}
.modal-search input{flex:1;border:none;outline:none;background:none;font-size:15px;color:var(--ink)}
.modal-body{max-height:55vh;overflow-y:auto;padding:6px}
.res-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:8px;cursor:pointer;font-size:13.5px;
}
.res-item.active{background:var(--accent-soft)}
.res-item .ic{font-size:15px;flex:none}
.res-item .meta{margin-left:auto;font-size:11px;color:var(--ink-4);flex:none}
.res-empty{padding:30px;text-align:center;color:var(--ink-4);font-size:13.5px}

footer{border-top:1px solid var(--border);padding:24px;text-align:center;color:var(--ink-4);font-size:12px}

/* 移动端 */
@media (max-width:640px){
  .topbar-in{padding:0 16px}
  main{padding:24px 16px 60px}
  .hero h1{font-size:23px}
  .grid{grid-template-columns:1fr}
  .search-wrap{margin:16px 0 20px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="./">
      <span class="logo">栈</span>
      <span>全栈知识库</span>
    </a>
    <div class="grow"></div>
    <button class="icon-btn" id="themeBtn" title="切换主题">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="eyebrow">📚 99 篇技术详解 · 离线可用</div>
    <h1>全栈技术知识库</h1>
    <p>从浏览器原理到 K8s，从 Vue 到 MySQL。每篇图文并茂，原理 + 实战 + 面试要点，手机电脑都能读。</p>

    <div class="search-wrap">
      <svg class="s-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="搜索文章标题…" autocomplete="off">
      <span class="kbd-hint">⌘K</span>
    </div>

    <div class="toolbar">
      <span class="lbl">深度</span>
      <button class="pill on" data-d="all">全部</button>
      <button class="pill" data-d="deep">深入</button>
      <button class="pill" data-d="std">标准</button>
      <button class="pill" data-d="basic">基础</button>
    </div>
  </section>

  <div class="grid" id="grid"></div>
</main>

<footer>全栈技术知识库 · 静态站点 · 断网可读</footer>

<!-- 搜索覆盖层 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="modalInput" type="text" placeholder="搜索文章标题、技术点…" autocomplete="off">
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="./assets/manifest.js"></script>
<script>
const M = window.KB_MANIFEST;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

/* 主题 */
(function(){
  let t = null;
  try{ t = localStorage.getItem('kb_theme'); }catch(e){}
  if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('kb_theme', next); }catch(e){}
};

/* 渲染分类卡片（每卡只显示前4篇） */
const grid = $('#grid');
let curDepth = 'all';
function render(){
  grid.innerHTML = '';
  M.cats.forEach(cat => {
    const arts = cat.arts.filter(a => curDepth === 'all' || a.d === curDepth);
    if(!arts.length) return;
    const card = document.createElement('div');
    card.className = 'cat';
    card.innerHTML = `
      <div class="cat-head">
        <div class="cat-ic">${cat.icon}</div>
        <div><h3>${cat.name}</h3><div class="n">${arts.length} 篇</div></div>
      </div>
      <div class="cat-desc">${cat.desc}</div>
      <div class="cat-arts"></div>`;
    const list = card.querySelector('.cat-arts');
    arts.slice(0, 4).forEach(a => {
      const item = document.createElement('a');
      item.className = 'cat-art';
      item.href = encodeURI(a.u);
      item.innerHTML = `<span class="dot ${a.d}"></span><span class="t">${a.t}</span>`;
      list.appendChild(item);
    });
    if(arts.length > 4){
      const more = document.createElement('div');
      more.style.cssText = 'padding:6px 8px;font-size:12px;color:var(--ink-4)';
      more.textContent = `还有 ${arts.length - 4} 篇…`;
      list.appendChild(more);
    }
    grid.appendChild(card);
  });
}
render();

$$('.pill').forEach(p => {
  p.onclick = () => {
    $$('.pill').forEach(x => x.classList.remove('on'));
    p.classList.add('on');
    curDepth = p.dataset.d;
    render();
  };
});

/* 全局搜索模态 */
const overlay = $('#overlay');
const modalInput = $('#modalInput');
const modalBody = $('#modalBody');
let flat = [];
M.cats.forEach(c => c.arts.forEach(a => flat.push({...a, catName: c.name, catIcon: c.icon})));
let results = [];
let activeIdx = 0;

function openModal(val=''){
  overlay.classList.add('show');
  modalInput.value = val;
  setTimeout(()=>modalInput.focus(), 30);
  doSearch(val);
}
function closeModal(){ overlay.classList.remove('show'); }
function doSearch(q){
  q = q.trim().toLowerCase();
  results = q ? flat.filter(a => a.t.toLowerCase().includes(q) || a.catName.toLowerCase().includes(q)) : flat.slice(0,12);
  activeIdx = 0;
  renderResults();
}
function renderResults(){
  modalBody.innerHTML = '';
  if(!results.length){ modalBody.innerHTML = '<div class="res-empty">没有找到匹配的文章</div>'; return; }
  results.slice(0,50).forEach((a,i) => {
    const div = document.createElement('div');
    div.className = 'res-item' + (i===activeIdx?' active':'');
    div.dataset.idx = i;
    div.innerHTML = `<span class="ic">${a.catIcon}</span><span>${a.t}</span><span class="meta">${a.catName}</span>`;
    modalBody.appendChild(div);
  });
}
modalBody.addEventListener('mouseover', e => {
  const it = e.target.closest('.res-item');
  if(!it) return;
  const i = +it.dataset.idx;
  if(i === activeIdx) return;
  activeIdx = i;
  modalBody.querySelectorAll('.res-item').forEach((el,j)=>el.classList.toggle('active', j===i));
});
modalBody.addEventListener('click', e => {
  const it = e.target.closest('.res-item');
  if(!it) return;
  const a = results[+it.dataset.idx];
  if(a) location.href = encodeURI(a.u);
});
overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });

/* 顶栏搜索框：聚焦即打开模态 */
$('#searchInput').addEventListener('focus', e => { e.target.blur(); openModal(); });
modalInput.addEventListener('input', e => doSearch(e.target.value));

document.addEventListener('keydown', e => {
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    overlay.classList.contains('show') ? closeModal() : openModal();
  }
  if(e.key==='Escape' && overlay.classList.contains('show')) closeModal();
  if(overlay.classList.contains('show')){
    if(e.key==='ArrowDown'){ e.preventDefault(); activeIdx=Math.min(results.length-1,activeIdx+1); renderResults(); }
    if(e.key==='ArrowUp'){ e.preventDefault(); activeIdx=Math.max(0,activeIdx-1); renderResults(); }
    if(e.key==='Enter'){ e.preventDefault(); const a=results[activeIdx]; if(a) location.href=encodeURI(a.u); }
  }
});
</script>
</body>
</html>
